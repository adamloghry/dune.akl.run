# Cloudflare Workers static assets: no Worker script, just files. Requests that serve a static
# asset are free and unmetered on the Workers free plan.
name = "dune-akl-run"
compatibility_date = "2026-11-01"

# Serve on dune.akl.run. Works when the akl.run zone is in the same Cloudflare account;
# Cloudflare creates the DNS record and certificate on first deploy.
routes = [{ pattern = "dune.akl.run", custom_domain = true }]

[assets]
directory = "./dist"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
